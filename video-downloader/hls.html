<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HLS 다운로드</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  .url { font-size: 12px; color: #666; word-break: break-all; }
  progress { width: 100%; height: 18px; }
  select, button { padding: 5px 8px; }
  #log { background: #f4f4f4; border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap; min-height: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>📼 스트리밍(HLS) 영상 합쳐서 받기</h1>
  <div class="url" id="src"></div>
  <p id="pick" class="hidden">화질 선택: <select id="variant"></select> <button id="start">받기 시작</button></p>
  <p><progress id="bar" value="0" max="1"></progress></p>
  <p id="info"></p>
  <button id="cancel" class="hidden">취소</button>
  <div id="log"></div>
  <p style="color:#777;font-size:12px">이 탭을 닫으면 다운로드가 중단됩니다. 본인이 권리를 가졌거나 다운로드가 허용된 콘텐츠에만 사용하세요.</p>
  <script src="reasons.js"></script>
  <script src="hls.js"></script>
</body>
</html>
